name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eywaa
          POSTGRES_PASSWORD: eywaa
          POSTGRES_DB: eywaa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eywaa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://eywaa:eywaa@localhost:5432/eywaa_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API type-check and tests
        working-directory: apps/api
        run: pnpm build && pnpm test
      - name: Admin type-check and build
        working-directory: apps/admin
        run: pnpm build
